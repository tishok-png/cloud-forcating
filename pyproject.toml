[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwfc"
version = "1.0.0"
description = "Cloud workload forecasting (Azure VM trace): baselines, Holt, Ridge, Random Forest, XGBoost"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "xgboost>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
